<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Weather Forecast</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="shell">
    <header class="topbar">
        <div class="brand"><span class="brand-mark">☼</span><span>Weather Forecast</span></div>
        <div class="topbar-actions">
            <span class="tagline">Your sky, simplified</span>
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to night mode">
                <span id="theme-icon">☾</span><span id="theme-label">Night mode</span>
            </button>
        </div>
    </header>
    <section class="hero">
        <p class="eyebrow">LIVE CONDITIONS</p>
        <h1>Know what the day<br><span>has in store.</span></h1>
        <form id="search-form" class="search">
            <label for="city-input" class="sr-only">Search for a city</label>
            <input id="city-input" type="search" placeholder="Search for a city..." autocomplete="off">
            <button type="submit">Search <span>→</span></button>
            <button id="clear-search" class="clear-button" type="button">Clear</button>
        </form>
        <p id="status" class="status" role="status">Fetching weather data...</p>
    </section>
    <section id="dashboard" class="dashboard" hidden>
        <div class="current-card">
            <div class="location"><span id="city"></span><span id="country"></span></div>
            <div class="current-main">
                <img id="current-icon" alt="" width="110" height="110">
                <div><strong id="temperature"></strong><span class="degree">°C</span></div>
            </div>
            <p id="condition" class="condition"></p>
            <p id="description" class="description"></p>
            <div class="stats">
                <div><span>FEELS LIKE</span><strong id="feels-like"></strong></div>
                <div><span>HUMIDITY</span><strong id="humidity"></strong></div>
                <div><span>WIND</span><strong id="wind"></strong></div>
                <div><span>PRESSURE</span><strong id="pressure"></strong></div>
            </div>
        </div>
        <div class="forecast-panel">
            <div class="section-heading"><h2>5-day forecast</h2><span>Daily outlook</span></div>
            <div id="forecast" class="forecast-grid"></div>
            <div class="sun-times"><span>☀ Sunrise <b id="sunrise"></b></span><span>☾ Sunset <b id="sunset"></b></span></div>
        </div>
    </section>
</main>
<script src="/js/app.js"></script>
</body>
</html>
